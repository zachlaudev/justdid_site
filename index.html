<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JustDid</title>
    <meta
      name="description"
      content="JustDid — track when household tasks were last done."
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
  </head>
  <body>
    <header class="topnav">
      <div class="container">
        <a href="/" class="brand">
          <img src="/logo.png" alt="" class="brand-logo" />
          <span>JustDid</span>
        </a>
        <nav>
          <a href="/privacy/">Privacy</a>
          <a href="/terms/">Terms</a>
          <a href="/support/">Support</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <img src="/logo.png" alt="JustDid" class="hero-logo" />
        <h1>JustDid</h1>
        <p class="tagline">Track when household tasks were last done.</p>
      </section>

      <section class="links">
        <a class="link-card" href="/privacy/">
          <span class="link-text">
            <span class="link-title">Privacy Policy</span>
            <span class="link-desc">How JustDid handles your data.</span>
          </span>
          <span class="chev">&rsaquo;</span>
        </a>
        <a class="link-card" href="/terms/">
          <span class="link-text">
            <span class="link-title">Terms of Service</span>
            <span class="link-desc"
              >Your agreement when using the app.</span
            >
          </span>
          <span class="chev">&rsaquo;</span>
        </a>
        <a class="link-card" href="/support/">
          <span class="link-text">
            <span class="link-title">Support</span>
            <span class="link-desc"
              >Get help, report a bug, share feedback.</span
            >
          </span>
          <span class="chev">&rsaquo;</span>
        </a>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <span>&copy; <span id="year"></span> JustDid</span>
        <span>
          <a href="/privacy/">Privacy</a>
          <a href="/terms/">Terms</a>
          <a href="/support/">Support</a>
        </span>
      </div>
    </footer>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
